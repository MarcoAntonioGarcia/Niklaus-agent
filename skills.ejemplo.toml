# Ejemplo de skills.toml: cópialo como skills.toml (no se publica) y agrega las tuyas. Es el catálogo de las skills
# del dueño (fuente de verdad), como herramientas.toml para las herramientas.
#
# Cada skill es una tabla [nombre]:
#   ruta         carpeta con el SKILL.md ("~" se expande). Las de terceros apuntan a su copia local auditada.
#   gestor       quién la mantiene: "niklaus" (Niklaus decide), "darkroom" (la herramienta), o cualquier otro
#                nombre (por ejemplo el de tu trabajo: Niklaus nunca mueve ni borra las de otros gestores)
#   ambito       dónde se carga su descripción (cuesta contexto en cada sesión):
#                  "global"     ~/.claude/skills (todas las sesiones, también las del trabajo)
#                  "niklaus"    ~/Apps/Niklaus/.claude/skills (solo las sesiones de Niklaus)
#                  "biblioteca" no se carga; se activa bajo demanda con la skill buscar-skill
#   categoria    agente | desarrollo | seguridad | diseño | investigación | contenido | trabajo
#   fuente       de dónde viene; licencia; commit si es de terceros (copia fijada)
#   riesgos      lo que la auditoría encontró (red, hooks, servicios externos); vacío si nada
#   etiquetas    palabras para buscarla
#
# Cambiar el ámbito de una skill: editar esta tabla y correr `tools/skills.py aplicar` (y `--global` si toca
# ~/.claude/skills, siempre con el OK del dueño). Agregar una skill: auditarla primero, como ECC o agent-skills.

# ---------- Niklaus ----------

[buscar-skill]
ruta = "~/Apps/Niklaus/skills/buscar-skill"
gestor = "niklaus"
ambito = "niklaus"
categoria = "agente"
fuente = "propia"
licencia = "MIT"
etiquetas = ["catálogo", "skills", "buscar", "activar"]

